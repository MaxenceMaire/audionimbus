[package]
name = "bevy-demo"
version = "0.1.0"
edition = "2024"
authors = ["Maxence Maire <maire.maxence@gmail.com>"]

[[bin]]
name = "bevy"
path = "src/main.rs"

[dependencies]
audionimbus = { path = "../..", features = ["bevy"] }
bevy = { version = "0.20", default-features = false, features = [
    "2d",
    "ui",
    "audio",
    "bevy_anti_alias",
    "bevy_gltf",
    "bevy_light",
    "bevy_mikktspace",
    "bevy_pbr",
    "free_camera",
    "gltf_animation",
    "ktx2",
    "morph",
    "morph_animation",
    "smaa_luts",
    "tonemapping_luts",
    "zstd_c",
] }
bevy_seedling = { git = "https://github.com/AwfulToTheEar/bevy_seedling.git", branch = "upgrade-to-bevy-0-20" }
rtrb = "0.3.5"
